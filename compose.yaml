services:
  crewai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crewai-service
    restart: unless-stopped
    command: ["uvicorn", "vms_agent.api:app", "--host", "0.0.0.0", "--port", "20080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:20080/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - app_net
      - egress_net
      - inference_net
    volumes:
      - ${HOME}/Verkstad/axi-assistant:/app
      - crewai_data:/data/crewai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:20080:20080"
    environment:
      PYTHONPATH: /app
      ORCHESTRATOR_MODEL: ${ORCHESTRATOR_MODEL}
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY}
      VMS_LLM_BASE_URL: ${VMS_LLM_BASE_URL}
      VMS_LLM_MODEL: ${VMS_LLM_MODEL}
      MCP_URL: ${ACS_MCP_URL}
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
  vllm-stt:
    image: nvcr.io/nvidia/vllm:26.08-py3
    environment:
      HF_HUB_OFFLINE: "1"
    ulimits:
      memlock: -1
      stack: 67108864
    container_name: vllm-stt
    restart: no
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/vllm-stt:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      vllm serve
      Qwen/Qwen3-ASR-1.7B
      --served-model-name stt
      --max-num-seqs 2
      --max-model-len 2048
      --gpu-memory-utilization 0.08
      --host 0.0.0.0
      --port 6180
    networks:
      - inference_net
  faster-tts:
    build:
      context: .
      dockerfile: Dockerfile.qwen3-tts
    container_name: faster-tts
    stdin_open: true
    tty: true
    restart: no
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      HF_HUB_OFFLINE: "1"
      TTS_MODEL: /models/tts/Qwen3-TTS-12Hz-1.7B-CustomVoice
      TTS_SPEAKER: Vivian
      TTS_MAX_SEQ_LEN: "2048"
      TTS_CHUNK_SIZE: "4"
    volumes:
      - /opt/models/tts:/models/tts:ro
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/Verkstad/axi-assistant:/app
    networks:
      - inference_net
    command: >
      uvicorn server:app
      --host 0.0.0.0
      --port 6280
  livekit-server:
    image: livekit/livekit-server:v1.10.0
    container_name: livekit-server
    restart: unless-stopped
    user: "1000:1000"
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${JETSON_LAN_IP}"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      volumes:
        - ${HOME}/Verkstad/axi-assistant/livekit/livekit.yaml:/etc/livekit.yaml:ro
      ports:
        - "${JETSON_LAN_IP}:7880:7880/tcp"
        - "${JETSON_LAN_IP}:7881:7881/tcp"
        - "${JETSON_LAN_IP}:7882:7882/udp"
      networks: [ edge_net, app_net ]

networks:
  app_net:
    internal: true
  egress_net: {}
  inference_net:
    internal: true
  edge_net: {}

volumes:
  crewai_data:
