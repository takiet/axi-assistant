services:
  crewai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crewai
    restart: unless-stopped
    command: bash
    networks:
      - app_net
      - egress_net
    volumes:
      - ${HOME}/Verkstad/axi-assistant:/app
      - crewai_data:/data/crewai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:20080:20080"
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

networks:
  app_net:
    internal: true
  egress_net: {}

volumes: 
  crewai_data:
